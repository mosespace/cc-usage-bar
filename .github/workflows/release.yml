name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent CCUsageBar.app CCUsageBar.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/CCUsageBar.zip
          generate_release_notes: true
