name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        run: |
          CCUSAGEBAR_ARCH=arm64 CCUSAGEBAR_BUILD_DIR=build-arm64 ./build.sh
          CCUSAGEBAR_ARCH=x86_64 CCUSAGEBAR_BUILD_DIR=build-x86_64 ./build.sh
          mkdir -p build/CCUsageBar.app/Contents/MacOS
          cp -R build-arm64/CCUsageBar.app/Contents/Resources build/CCUsageBar.app/Contents/
          cp build-arm64/CCUsageBar.app/Contents/Info.plist build/CCUsageBar.app/Contents/
          cp build-arm64/CCUsageBar.app/Contents/PkgInfo build/CCUsageBar.app/Contents/
          lipo -create \
            build-arm64/CCUsageBar.app/Contents/MacOS/CCUsageBar \
            build-x86_64/CCUsageBar.app/Contents/MacOS/CCUsageBar \
            -output build/CCUsageBar.app/Contents/MacOS/CCUsageBar
          codesign --force --sign - \
            --entitlements CCUsageBar/CCUsageBar/CCUsageBar.entitlements \
            build/CCUsageBar.app

      - name: Package app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent CCUsageBar.app CCUsageBar.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/CCUsageBar.zip
          generate_release_notes: true
